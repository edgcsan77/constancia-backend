<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>Arial MT</family>
    <prefer><family>Arial</family></prefer>
  </alias>
  <alias>
    <family>ArialUnicodeMS</family>
    <prefer><family>Arial</family></prefer>
  </alias>
  <alias>
    <family>Arial Unicode MS</family>
    <prefer><family>Arial</family></prefer>
  </alias>
  <alias>
    <family>Lucida Sans Unicode</family>
    <prefer><family>Arial</family></prefer>
  </alias>
</fontconfig>
